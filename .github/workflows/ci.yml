# ═══════════════════════════════════════════════════════════
# CI — runs on every push and pull request.
# Catches syntax errors and broken logic BEFORE the daily run
# picks the change up at 09:00 the next morning.
# No network, no browser, no secrets: it only runs the offline tests.
# ═══════════════════════════════════════════════════════════

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all modules (syntax + import check)
        run: python -m py_compile *.py

      - name: Run offline tests
        run: python -m pytest -q
