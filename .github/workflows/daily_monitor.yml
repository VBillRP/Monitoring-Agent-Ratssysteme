# ═══════════════════════════════════════════════════════════
# GitHub Actions Workflow — German Council Monitor
# ═══════════════════════════════════════════════════════════
# This tells GitHub to run the Python script automatically
# every weekday morning at 9:00 AM Berlin time (7:00 AM UTC).
#
# It can also be triggered manually from the GitHub website
# by clicking "Run workflow" in the Actions tab.
# ═══════════════════════════════════════════════════════════

name: German Council Monitor

on:
  # ── Automatic schedule (cron syntax) ──
  # Runs at 07:00 UTC = 09:00 CET (Berlin time)
  # "1-5" means Monday through Friday only
  schedule:
    - cron: '0 7 * * 1-5'

  # ── Manual trigger ──
  # Allows you to click "Run workflow" on GitHub at any time.
  # Untick "send_teams" to test a change WITHOUT posting to the team
  # channel — the run page still shows the full summary and artifacts.
  workflow_dispatch:
    inputs:
      send_teams:
        description: "Post the results card to Teams"
        type: boolean
        default: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Safety: cancel if it takes too long

    steps:
      # Step 1: Download your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install Python packages
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Step 4: Install the Chrome browser for Playwright
      - name: Install Playwright browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      # Step 5: Run the monitor script
      # The secrets are injected as environment variables.
      #   TEAMS_WEBHOOK_URL      → results card, team channel
      #   TEAMS_DEV_WEBHOOK_URL  → diagnostics card, private dev channel (optional)
      #   ENABLE_AI_FILTER       → repository VARIABLE (Settings → Variables), "true" to switch on
      - name: Run Council Monitor
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_DEV_WEBHOOK_URL: ${{ secrets.TEAMS_DEV_WEBHOOK_URL }}
          ENABLE_AI_FILTER: ${{ vars.ENABLE_AI_FILTER || 'false' }}
        run: python main.py ${{ github.event.inputs.send_teams == 'false' && '--no-teams' || '' }}

      # Step 6: Keep the evidence — summary table, full JSON, and a
      # screenshot + HTML snapshot of every city that failed.
      - name: Upload run summary and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            run-summary.md
            run-results.json
            debug/
          if-no-files-found: ignore
          retention-days: 30
